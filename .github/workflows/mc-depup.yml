name: Minecraft Dependency Updates

on:
  schedule:
    - cron: "0 8 * * 1" # Runs every Monday at 8:00 AM UTC
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  depup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run MC-DepUp
        uses: LucunJi/MC-DepUp@v0.1.2
        with:
          update_mc_patch: false

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update Minecraft mod dependencies"
          title: "chore(deps): automated dependency updates via MC-DepUp"
          body: "Automated dependency updates triggered by MC-DepUp."
          branch: "chore/mc-depup-updates"
          delete-branch: true
