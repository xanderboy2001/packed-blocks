name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spotless Check & Build
        run: ./gradlew spotlessCheck build

      - name: Run Datagen & Check for Drift
        run: |
          ./gradlew runDatagen
          if [[ -n $(git status --porcelain src/main/generated) ]]; then
            echo "Error: Generated files are out of sync with the code! Run ./gradlew runDatagen and commit the changes."
            git diff src/main/generated
            exit 1
          fi

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Mod-Artifacts
          path: build/libs/*.jar
