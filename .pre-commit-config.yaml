repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: local
    hooks:
      - id: gradle-spotless
        name: Gradle Spotless Apply
        entry: ./gradlew spotlessapply
        language: system
        types: [java]
        pass_filenames: false
